name: Compilar y desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Sube /dist a Hostinger solo en main y solo si ya existen los Secrets.
      - name: Desplegar a Hostinger por FTP
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          dangerous-clean-slate: false

      - name: Aviso si faltan Secrets
        if: github.event_name != 'pull_request' && env.FTP_SERVER == ''
        run: echo "::notice::Compilación correcta. Falta configurar FTP_SERVER, FTP_USERNAME y FTP_PASSWORD para desplegar."
